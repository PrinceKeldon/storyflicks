name: Frontend quality checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, ESLint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # PR builds validate a generated lockfile; main pushes persist any lockfile changes.
      - name: Generate lockfile when missing
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Full dependency audit report
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=JSON.parse(require("node:fs").readFileSync("/tmp/npm-audit.json","utf8")); for (const [name, v] of Object.entries(a.vulnerabilities || {})) console.log(name+" | "+v.severity+" | direct="+v.isDirect+" | fix="+JSON.stringify(v.fixAvailable)+" | "+v.via.map(x => typeof x === "string" ? x : x.title).join("; "))'

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit generated lockfile
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            git add frontend/package-lock.json
            if ! git diff --cached --quiet -- frontend/package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add reproducible frontend dependency lockfile"
              git push
            fi
          fi
