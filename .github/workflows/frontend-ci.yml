name: STORYFLICKS quality checks

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "app/**"
      - "requirements.txt"
      - "supabase/migrations/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "app/**"
      - "requirements.txt"
      - "supabase/migrations/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storyflicks-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript, ESLint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # PR builds validate a generated lockfile; main pushes persist any lockfile changes.
      - name: Generate lockfile when missing
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply compatible dependency security fixes
        run: npm audit fix --no-fund

      - name: Audit full dependency tree
        run: npm audit --audit-level=moderate

      - name: TypeScript validation
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Commit generated lockfile
        if: github.event_name != 'pull_request'
        working-directory: .
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            git add frontend/package-lock.json
            if ! git diff --cached --quiet -- frontend/package-lock.json; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Add reproducible frontend dependency lockfile"
              git push
            fi
          fi

  backend:
    name: Backend import and syntax checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check dependency consistency
        run: pip check

      - name: Compile backend modules
        run: python -m compileall -q app

      - name: Import FastAPI application
        run: python -c "from app.main import app; assert app; print(f'Loaded {len(app.routes)} API routes')"
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: ci-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
          SCHEDULER_SECRET: ci-scheduler-secret
